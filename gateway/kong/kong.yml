_format_version: "3.0"
_transform: true

plugins:
  - name: prometheus
    config:
      per_consumer: false
      status_code_metrics: true
      latency_metrics: true
      bandwidth_metrics: true
      upstream_health_metrics: true

services:
  - name: fastapi-service
    url: http://api:8000
    routes:
      - name: fastapi-route
        paths:
          - /api
        strip_path: true
