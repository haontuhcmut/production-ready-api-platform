name: CI Pipeline

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - main
jobs:
  test:
    name: Run API services
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install deps and Ruff
        run: |
          uv sync
          uv run ruff check .
          uv run ruff format --check .

      - name: Run tests
        run: |
          uv run pytest