
groups:
  - name: fastapi-alerts
    rules:
      - alert: FastAPIUnavailable
        expr: up{job="fastapi"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: FastAPI is unavailable
          description: Prometheus cannot scrape the FastAPI metrics endpoint for more than one minute.

      - alert: FastAPIHigh5xxErrorRate
        expr: |
          (
            sum(rate(http_requests_total{job="fastapi", status=~"5.."}[5m]))
            /
            clamp_min(sum(rate(http_requests_total{job="fastapi"}[5m])), 1)
          ) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: FastAPI 5xx error rate is high
          description: More than 5 percent of FastAPI requests returned 5xx responses over the evaluation window.
