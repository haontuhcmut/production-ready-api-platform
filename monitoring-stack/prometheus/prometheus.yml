global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/alerts/*.yml

scrape_configs:
  - job_name: fastapi
    metrics_path: /metrics
    static_configs:
      - targets:
          - api:8000

  - job_name: kong
    metrics_path: /metrics
    static_configs:
      - targets:
          - kong:8100

  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: nginx
    static_configs:
      - targets:
          - nginx-exporter:9113
