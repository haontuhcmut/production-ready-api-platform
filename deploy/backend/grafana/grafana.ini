# ============================================================================
# Grafana Main Configuration File
# Official Documentation: https://grafana.com/docs/grafana/latest/setup-grafana/configure-grafana/
# ============================================================================

# [server] Server Configuration
# Used to configure the basic settings of the Grafana HTTP server
[server]
# Protocol type
protocol = http

# HTTP service listening port
http_port = 3000

# [security] Security Configuration
# Used to configure default safety settings for Grafana
[security]
# Default Grafana admin username
admin_user = admin

# Default Grafana admin password
admin_password = 123456

# If you are hosting Grafana over HTTPS
;cookie_secure = true

# Instructs the browser to allow rendering Grafana inside <frame>, <iframe>, <embed>, or <object> elements
;allow_embedding = true

# [users] User Configuration
# Used to configure default settings related to users
[users]
# Placeholder text for the login name/username input on the login page
;login_hint = test

# Placeholder text for the password input on the login page
;password_hint = 123456

# Default UI theme
default_theme = system

# Default interface language
default_language = en-US

# [dashboards] Dashboard Configuration
# Used to configure default settings related to dashboards
[dashboards]
# Path to the default home dashboard
default_home_dashboard_path = /etc/grafana/dashboards/server.json
